<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}" class="scroll-smooth bg-neutral-50 dark:bg-neutral-950">

  {%- include head.html -%}

  <body class="bg-neutral-50 dark:bg-neutral-950">
    <header class="px-10 pt-8">
      <nav aria-label="Primary">
        <ul class="flex gap-16 font-display dark:text-neutral-200">
          <li>
            <a href="{{ '/' | relative_url }}" class="px-0.5 rounded-sm hover:bg-neutral-900 hover:dark:bg-neutral-200 hover:dark:text-neutral-950 hover:text-neutral-200"><span class="pr-1">01</span> Home</a>
          </li>
          <li>
            <a href="/writing" class="px-0.5 rounded-sm hover:bg-neutral-900 hover:dark:bg-neutral-200 hover:dark:text-neutral-950 hover:text-neutral-200"><span class="pr-1">02</span> Writing</a>
          </li>
        </ul>
      </nav>
    </header>
    <main aria-label="Content" class="px-10 py-12 dark:text-neutral-200">
      <h1 class="pb-10 text-3xl font-bold tracking-wider font-display dark:text-neutral-50">
      Jacob Foster Heimark
      </h1>
        {{ content }}
    </main>
    <footer class="flex items-center justify-between max-w-2xl py-8 mx-10 text-sm font-display dark:text-neutral-500">
      <span>© {{ "now" | date: "%Y" }} Jacob Foster Heimark.</span>
      <div class="flex font-display gap-x-2">
        <a href="mailto:jake@heimark.org" class="inline-block size-4" target="_blank" rel="noopener noreferrer">
            {% include icons/mail.svg %}
        </a>
        <a href="https://github.com/hmk" class="inline-block size-4" target="_blank" rel="noopener noreferrer">
          {% include icons/Github.svg %}
        </a>
        <a href="https://linkedin.com/in/jakeheimark" class="inline-block size-4" target="_blank" rel="noopener noreferrer">
          {% include icons/LinkedIn.svg %}
        </a>
      </div>
    </footer>
  </body>
</html>
